version: "3.9"

services:
  # ----------------------------
  # Laravel App (PHP-FPM)
  # ----------------------------
  backend:
    container_name: yabasha-backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./apps/backend:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: yabasha
      DB_USERNAME: yabasha
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - yabasha

  # ----------------------------
  # Nginx Web Server for Laravel
  # ----------------------------
  nginx:
    container_name: yabasha-nginx
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./apps/backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - yabasha

  # ----------------------------
  # MySQL Database
  # ----------------------------
  mysql:
    container_name: yabasha-mysql
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: yabasha
      MYSQL_USER: yabasha
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - yabasha

  # ----------------------------
  # Redis Cache / Queue
  # ----------------------------
  redis:
    container_name: yabasha-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yabasha

  # ----------------------------
  # Horizon Worker (Queues)
  # ----------------------------
  horizon:
    container_name: yabasha-horizon
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./apps/backend:/var/www/html
    depends_on:
      - backend
      - redis
      - mysql
    networks:
      - yabasha

  # ----------------------------
  # Mailpit (SMTP catcher)
  # ----------------------------
  mailpit:
    container_name: yabasha-mailpit
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - yabasha

  # ----------------------------
  # Meilisearch (Optional Search Engine)
  # ----------------------------
  meilisearch:
    container_name: yabasha-meilisearch
    image: getmeili/meilisearch:v1.5
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey123
    volumes:
      - meili_data:/meili_data
    networks:
      - yabasha

networks:
  yabasha:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  meili_data:
